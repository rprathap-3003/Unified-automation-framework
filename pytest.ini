[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --tb=short
    --alluredir=reports/allure-results
    --html=reports/html/report.html
    --self-contained-html

markers =
    web: Web UI automation tests using Selenium WebDriver
    mobile: Mobile app automation tests using Appium (Android & iOS)
    api: REST / HTTP API automation tests using Requests
    desktop: Windows desktop automation tests using PyWinAuto
    e2e: Cross-platform end-to-end integration workflows
    smoke: Critical path smoke validation tests
    regression: Comprehensive regression test suite

filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S
